; Root-level pytest config so rootdir is the repo root: markers register correctly
; and `pytest` works from anywhere without cd-ing into backend/.
[pytest]
testpaths = tests
pythonpath = backend
asyncio_mode = auto
markers =
    postgres: requires a real PostgreSQL/TimescaleDB instance (set TEST_DATABASE_URL)
filterwarnings =
    ignore::DeprecationWarning:starlette.*
