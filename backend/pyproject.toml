[project]
name = "tradebot-backend"
version = "0.1.0"
description = "Autonomous AI trading platform — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "celery>=5.4",
    "passlib[bcrypt]>=1.7",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    # Upper bound is deliberate. Windows Smart App Control blocks the pandas 3.x
    # native extension (pandas._libs.lib) as untrusted, which takes down every
    # market-data path with "DLL load failed ... An Application Control policy
    # has blocked this file." 2.x is widely enough deployed to be trusted.
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "structlog>=24.1",
    # Host CPU/memory/disk sampling for the operations health metrics.
    "psutil>=5.9",
    # IANA tz database — absent from Windows; required for Asia/Kolkata handling.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # B008: FastAPI's dependency-injection idiom *is* a call in a default argument
    # (`Depends(...)`, `Query(...)`). Flagging it here is a framework false positive.
    "B008",
    # UP042: enums deliberately inherit `(str, Enum)` rather than `StrEnum` so that
    # SQLAlchemy `Enum(...)` columns and JSON serialization behave consistently.
    "UP042",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

# pytest configuration lives in the repo-root pytest.ini so rootdir resolves
# correctly across backend/ and tests/.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
