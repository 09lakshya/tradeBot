# Cloud-VM overrides: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Removes bind-mounts/reload, adds restart policies for always-on operation (spec §18).
services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped
    volumes: []

  worker:
    restart: unless-stopped
    volumes: []

  beat:
    restart: unless-stopped
    volumes: []

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  frontend:
    command: npm run start
    restart: unless-stopped
    volumes: []
